<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Your Email</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 600px;
        margin: 40px auto;
        background: #fff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .header {
        background: #4f46e5;
        padding: 32px;
        text-align: center;
      }
      .header h1 {
        color: #fff;
        margin: 0;
        font-size: 24px;
      }
      .body {
        padding: 32px;
      }
      .body p {
        color: #444;
        line-height: 1.6;
      }
      .btn {
        display: inline-block;
        margin: 24px 0;
        padding: 14px 32px;
        background: #4f46e5;
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
      }
      .footer {
        text-align: center;
        padding: 16px;
        color: #aaa;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header"><h1>Verify Your Email</h1></div>
      <div class="body">
        <p>Hi <strong th:text="${firstName}">User</strong>,</p>
        <p>
          Thank you for registering! Please click the button below to verify
          your email address.
        </p>
        <p style="text-align: center">
          <a th:href="${verificationUrl}" class="btn">Verify Email Address</a>
        </p>
        <p>This link expires in <strong>24 hours</strong>.</p>
        <p>
          If you did not create an account, you can safely ignore this email.
        </p>
      </div>
      <div class="footer">© 2025 Your App. All rights reserved.</div>
    </div>
  </body>
</html>
