<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Your Password</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
        .header { background: #DC2626; padding: 32px; text-align: center; }
        .header h1 { color: #fff; margin: 0; font-size: 24px; }
        .body { padding: 32px; }
        .body p { color: #444; line-height: 1.6; }
        .btn { display: inline-block; margin: 24px 0; padding: 14px 32px; background: #DC2626; color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold; }
        .footer { text-align: center; padding: 16px; color: #aaa; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>Reset Your Password</h1></div>
    <div class="body">
        <p>Hi <strong th:text="${firstName}">User</strong>,</p>
        <p>We received a request to reset your password. Click the button below to proceed.</p>
        <p style="text-align:center">
            <a th:href="${resetUrl}" class="btn">Reset Password</a>
        </p>
        <p>This link expires in <strong>30 minutes</strong>. If you did not request a password reset, please ignore this email or contact support.</p>
    </div>
    <div class="footer">© 2025 Your App. All rights reserved.</div>
</div>
</body>
</html>
